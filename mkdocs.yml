site_name: ENME480 — Introduction to Robotics
site_description: ENME480 at the University of Maryland, Fall 2026 — kinematics, dynamics and ROS 2 on UR3e arms, with a vision-guided final project
site_url: https://enme480.github.io/
repo_url: https://github.com/ENME480/enme480.github.io

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.footer
    - content.tooltips
    - toc.follow
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    logo: material/robot
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - blog
  - include-markdown
  - social

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ENME480
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/UMDMaryland

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - javascripts/math.js
  - https://cdn.jsdelivr.net/npm/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css
  - styles/theme.css

not_in_nav: |
  _labcode/**
  labs/week-10.md
  labs/week-11.md
  labs/week-14.md
  labs/week-15.md
  labs/final-project.md
  ur3e-guide.md
  math-tools.md
  code-examples.md
  enae450_readme.md
  blog/**

nav:
  - Home: index.md
  - Syllabus (PDF): assets/docs/syllabus-fall2026.pdf
  - Labs:
      - Overview: labs/index.md
      - Week 1 — Lab Intro: labs/week-01.md
      - Week 2 — Ubuntu & Python: labs/week-02.md
      - Week 3 — ROS Tutorial: labs/week-03.md
      - Week 4 — Gazebo Demo: labs/week-04.md
      - Week 5 — UR3e Intro, FK Lab 1.1: labs/week-05.md
      - Week 6 — FK Simulation, FK Lab 1.2: labs/week-06.md
      - Week 7 — No Lab: labs/week-07.md
      - Week 8 — Inverse Kinematics: labs/week-08.md
      - Week 9 — UR3e IK Lab: labs/week-09.md
      - Week 12 — Camera Lab: labs/week-12.md
      - Weeks 13-15 — Final Project: labs/week-13.md
  - Slides: slides.md
  - Setup:
      - Ubuntu Setup: ubuntu-setup.md
      - ROS Setup: ros-setup.md
      - Gazebo Setup: gazebo-setup.md
      - Dev Environment: dev-environment.md
      - Python Basics: python-basics.md
      - Git Basics: git-basics.md
  - Resources:
      - Overview: resources.md
      - Kinematics Reference: kinematics-reference.md
      - UR3e DH Table: assets/docs/dh_table.pdf
  - Help: help.md
  - Site Map: site-map.md
